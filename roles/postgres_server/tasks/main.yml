---
- name: Assert we're running on a supported OS
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      This role supports Ubuntu (Debian family) and Rocky/AlmaLinux
      (RedHat family). Got: {{ ansible_distribution }} ({{ ansible_os_family }})

- name: Load OS-specific paths and service naming
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  # Loads vars/Debian.yml or vars/RedHat.yml -- this is what lets every
  # task file below stay OS-agnostic, referencing pg_config_dir /
  # pg_conf_path / pg_service_name etc. rather than hardcoded paths.

- name: STEP 1 (Debian/Ubuntu) -- Add PGDG repo and install PostgreSQL
  ansible.builtin.import_tasks: install_Debian.yml
  when: ansible_os_family == 'Debian'

- name: STEP 1 (RHEL family) -- Add PGDG repo and install PostgreSQL
  ansible.builtin.import_tasks: install_RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: STEP 2 -- Prepare and mount data disk, relocate PGDATA
  ansible.builtin.import_tasks: disk.yml

- name: STEP 3 -- Template postgresql.conf / pg_hba.conf
  ansible.builtin.import_tasks: configure.yml

- name: STEP 4 -- Create app database, user, grants
  ansible.builtin.import_tasks: users_db.yml
