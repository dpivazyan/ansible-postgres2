---
# Runs after Step 3, so scram-sha-256 is already the active encryption
# method and the user created here gets a properly hashed password.
#
# These tasks connect as the OS 'postgres' user over the local Unix
# socket (peer auth, see pg_hba.conf.j2) -- no password needed for the
# connection Ansible itself makes to run these.
#
# Ownership model: the app user is made the OWNER of both the database
# and its public schema. That gives them everything reasonably meant by
# "admin on my database" -- full control to create/alter/drop tables,
# indexes, functions, extensions, and to grant privileges on their own
# objects to any additional users they create -- WITHOUT the real
# Postgres SUPERUSER attribute, which would let them touch the OS,
# other databases, or server-wide config. See README for the reasoning.

- name: Guard against pg_app_db_user being set to the postgres superuser
  ansible.builtin.assert:
    that:
      - pg_app_db_user != 'postgres'
    fail_msg: >-
      pg_app_db_user is set to 'postgres' -- that's the bootstrap superuser
      and Postgres will refuse to strip its SUPERUSER attribute. Set
      pg_app_db_user to a distinct application username instead.

- name: Ensure application user exists with the supplied password
  community.postgresql.postgresql_user:
    name: "{{ pg_app_db_user }}"
    password: "{{ pg_app_db_password }}"
    role_attr_flags: "NOSUPERUSER,{{ 'CREATEDB' if (pg_app_user_can_create_db | bool) else 'NOCREATEDB' }},NOCREATEROLE"
    update_password: always   # without this, some collection versions only set the
                               # password when the role is first created, and silently
                               # skip it on later runs against an existing role — which
                               # means a changed pg_app_db_password wouldn't actually
                               # take effect on redeploys/retries
    state: present
  become: true
  become_user: postgres
  no_log: false   # keeps the password out of AWX job output/logs
  # User is created before the database (reversed from before) so the
  # database can be created with owner set directly, in one step.

- name: Ensure application database exists, owned by the app user
  community.postgresql.postgresql_db:
    name: "{{ pg_app_db_name }}"
    encoding: UTF-8
    owner: "{{ pg_app_db_user }}"
    state: present
  become: true
  become_user: postgres

- name: Make the app user owner of the public schema (full CREATE/manage rights inside it)
  community.postgresql.postgresql_schema:
    db: "{{ pg_app_db_name }}"
    name: public
    owner: "{{ pg_app_db_user }}"
    state: present
  become: true
  become_user: postgres

- name: Report deployment summary
  ansible.builtin.debug:
    msg:
      - "PostgreSQL {{ pg_version }} deployed successfully"
      - "Listening on {{ pg_listen_addresses }}:{{ pg_port }}"
      - "Database: {{ pg_app_db_name }}  |  Owner/admin user: {{ pg_app_db_user }}"
      - "Data directory: {{ pg_data_mount_point if (pg_use_separate_data_disk | bool) else pg_data_dir_default }}"
