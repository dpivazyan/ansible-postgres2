---
# Loaded via include_vars when ansible_os_family == 'RedHat'.
#
# Important difference from Debian: RHEL-family PGDG packages keep
# postgresql.conf and pg_hba.conf INSIDE the data directory itself, not
# in a separate /etc path. That means when pg_use_separate_data_disk
# relocates the data directory, the config files move with it — so
# pg_config_dir here is computed dynamically rather than fixed.

pg_data_dir_default: "/var/lib/pgsql/{{ pg_version }}/data"
pg_config_dir: "{{ pg_data_mount_point if (pg_use_separate_data_disk | bool) else pg_data_dir_default }}"
pg_conf_path: "{{ pg_config_dir }}/postgresql.conf"
pg_hba_path: "{{ pg_config_dir }}/pg_hba.conf"
pg_conf_d_dir: "{{ pg_config_dir }}/conf.d"
pg_service_name: "postgresql-{{ pg_version }}"

# RHEL's PGDG package does NOT auto-include a conf.d directory —
# configure.yml adds the `include_dir` line explicitly when this is true.
pg_conf_d_needs_include_line: true
