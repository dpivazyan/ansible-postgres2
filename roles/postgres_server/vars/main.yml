---
# Ubuntu/Debian packaging paths. These are internal implementation
# details (not meant to be overridden per-request the way defaults/
# main.yml values are) -- they're here rather than in defaults purely
# so they're clearly separated from the actual parameter contract.

pg_data_dir_default: "/var/lib/postgresql/{{ pg_version }}/main"
pg_config_dir: "/etc/postgresql/{{ pg_version }}/main"
pg_conf_path: "{{ pg_config_dir }}/postgresql.conf"
pg_hba_path: "{{ pg_config_dir }}/pg_hba.conf"
pg_conf_d_dir: "{{ pg_config_dir }}/conf.d"
pg_service_name: "postgresql@{{ pg_version }}-main"

# Internal lookup table for postgresql.conf tuning, keyed by pg_tier.
# The template (templates/pg_dbaas_overrides.conf.j2) references
# pg_tuning[pg_tier] rather than raw variables, so adding a new tier
# later just means adding one more entry here.
pg_tuning:
  small:
    shared_buffers: "256MB"
    max_connections: 50
    effective_cache_size: "768MB"
    work_mem: "4MB"
  medium:
    shared_buffers: "1GB"
    max_connections: 100
    effective_cache_size: "3GB"
    work_mem: "8MB"
  large:
    shared_buffers: "4GB"
    max_connections: 200
    effective_cache_size: "12GB"
    work_mem: "16MB"
