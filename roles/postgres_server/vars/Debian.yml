---
# Loaded via include_vars when ansible_os_family == 'Debian'.
#
# Debian/Ubuntu packaging keeps config files separate from the data
# directory permanently (/etc/postgresql/...), regardless of where
# PGDATA itself points — so pg_config_dir is static here, unlike RedHat.

pg_data_dir_default: "/var/lib/postgresql/{{ pg_version }}/main"
pg_config_dir: "/etc/postgresql/{{ pg_version }}/main"
pg_conf_path: "{{ pg_config_dir }}/postgresql.conf"
pg_hba_path: "{{ pg_config_dir }}/pg_hba.conf"
pg_conf_d_dir: "{{ pg_config_dir }}/conf.d"
pg_service_name: "postgresql@{{ pg_version }}-main"

# Debian's postgresql-common packaging already adds `include_dir 'conf.d'`
# to postgresql.conf by default — RedHat's does not, see configure.yml.
pg_conf_d_needs_include_line: false
