---
collections:
  - name: community.postgresql
    version: ">=3.3.0,<4.0.0"   # pinned range — avoids drift like the update_password
                                # parameter change we hit between minor versions
  - name: ansible.posix     # provides the 'mount' module we need for disk handling
    version: ">=1.5.0"
  - name: community.general # provides the 'filesystem' module (mkfs wrapper)
    version: ">=8.0.0"
